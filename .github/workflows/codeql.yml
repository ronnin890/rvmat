name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7              # pin: scripts/pin_actions.py
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v3     # pin: scripts/pin_actions.py
        with: { languages: python }
      - uses: github/codeql-action/analyze@v3  # pin: scripts/pin_actions.py
