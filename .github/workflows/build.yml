name: tests
on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: pip install -r requirements.txt pytest
      - name: Тесты (включая интерфейс tkinter под Xvfb)
        run: xvfb-run -a python -m pytest -q
      - name: Самопроверка приложения
        run: xvfb-run -a python -m rvmat_studio --selftest

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m rvmat_studio --selftest
