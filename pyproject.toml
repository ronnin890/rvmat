[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rvmat-studio"
version = "0.4.0"
description = "DayZ RVMAT Studio — редактор и генератор материалов .rvmat (Qt/PySide6)"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6,<7", "numpy>=1.26,<3", "Pillow>=10.0,<13"]

[project.optional-dependencies]
gl = ["moderngl>=5.8,<6"]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "pre-commit"]

[project.scripts]
rvmat-studio = "rvmat_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["rvmat_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B006", "B008", "S102", "S307", "S602"]
ignore = ["F401", "F841", "F811"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.coverage.run]
source = ["rvmat_studio"]

[tool.coverage.report]
fail_under = 85
