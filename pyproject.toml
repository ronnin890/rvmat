[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rvmat-studio"
version = "0.2.0"
description = "DayZ RVMAT Studio — редактор и генератор материалов .rvmat (tkinter, без Qt)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10.0"]

[project.optional-dependencies]
gl = ["moderngl>=5.8"]
dev = ["pytest"]

[project.scripts]
rvmat-studio = "rvmat_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["rvmat_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
