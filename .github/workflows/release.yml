name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # только для публикации релиза
    steps:
      - uses: actions/checkout@v4          # pin: scripts/pin_actions.py
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5      # pin: scripts/pin_actions.py
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock }
      - run: pip install --require-hashes -r requirements.lock pyinstaller
      - run: python -m pytest -q
      - name: Сборка exe (PyInstaller, без консоли)
        run: pyinstaller --noconfirm --onefile --windowed --name DayZRvmatStudio --collect-submodules rvmat_studio rvmat_studio/__main__.py
      - name: Контрольные суммы SHA-256
        shell: pwsh
        run: |
          Get-FileHash dist/DayZRvmatStudio.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  DayZRvmatStudio.exe" } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
      - name: Публикация релиза (gh)
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${{ github.ref_name }}" dist/DayZRvmatStudio.exe dist/SHA256SUMS.txt --title "${{ github.ref_name }}" --generate-notes
